<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" role="img" aria-label="Developer coding on a laptop" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .float{animation:float 3.5s ease-in-out infinite}
    .d1{animation-delay:.5s}.d2{animation-delay:1.1s}.d3{animation-delay:1.7s}.d4{animation-delay:2.3s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

    .ring{transform-origin:240px 175px;animation:spin 40s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .line{transform-box:fill-box;transform-origin:left center;animation:type 6s ease-in-out infinite}
    .l2{animation-delay:.5s}.l3{animation-delay:1s}.l4{animation-delay:1.5s}.l5{animation-delay:2s}
    @keyframes type{0%{transform:scaleX(0)}25%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}

    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}

    .eye{transform-box:fill-box;transform-origin:center;animation:eye 4s infinite}
    @keyframes eye{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

    .tapL{animation:tap .5s ease-in-out infinite}
    .tapR{animation:tap .5s ease-in-out .25s infinite}
    @keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

    .glow{animation:glow 2.4s ease-in-out infinite}
    @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}

    .steam{animation:steam 2.4s ease-in infinite}
    .s2{animation-delay:.8s}.s3{animation-delay:1.6s}
    @keyframes steam{0%{opacity:0;transform:translateY(0)}40%{opacity:.8}100%{opacity:0;transform:translateY(-14px)}}

    .sway{transform-origin:124px 258px;animation:sway 4s ease-in-out infinite}
    @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

    .twinkle{animation:twinkle 2.5s ease-in-out infinite}
    @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}

    .chip{font-family:'Courier New',monospace;font-size:13px;font-weight:bold;fill:#fff;text-anchor:middle}
  </style>

  <!-- background -->
  <circle cx="240" cy="180" r="150" fill="#7C6FF0" opacity=".10"/>
  <circle class="ring" cx="240" cy="175" r="162" fill="none" stroke="#7C6FF0" stroke-width="1.5" stroke-dasharray="4 10" opacity=".35"/>
  <ellipse cx="240" cy="330" rx="170" ry="6" fill="#000" opacity=".08"/>

  <!-- sparkles -->
  <circle class="twinkle" cx="150" cy="58" r="2.5" fill="#F59E0B"/>
  <circle class="twinkle d2" cx="300" cy="205" r="2" fill="#F59E0B"/>
  <circle class="twinkle d3" cx="95" cy="110" r="2" fill="#7C6FF0"/>
  <circle class="twinkle d1" cx="440" cy="120" r="2.5" fill="#EC4899"/>

  <!-- floating chips -->
  <g class="float"><rect x="28" y="64" width="56" height="26" rx="13" fill="#7C6FF0"/><text class="chip" x="56" y="82">&lt;/&gt;</text></g>
  <g class="float d1"><rect x="44" y="136" width="58" height="26" rx="13" fill="#EA580C"/><text class="chip" x="73" y="154">Java</text></g>
  <g class="float d2"><rect x="22" y="188" width="44" height="26" rx="13" fill="#2563EB"/><text class="chip" x="44" y="206">Py</text></g>
  <g class="float d3"><rect x="196" y="22" width="76" height="26" rx="13" fill="#EC4899"/><text class="chip" x="234" y="40">GenAI</text></g>
  <g class="float d4"><rect x="396" y="196" width="62" height="26" rx="13" fill="#0EA5E9"/><text class="chip" x="427" y="214">React</text></g>

  <!-- code window -->
  <g class="float d2">
    <rect x="318" y="60" width="150" height="112" rx="9" fill="#1E1E2E"/>
    <path d="M318 69a9 9 0 0 1 9-9h132a9 9 0 0 1 9 9v7H318z" fill="#2B2B40"/>
    <circle cx="330" cy="68" r="3" fill="#F87171"/>
    <circle cx="340" cy="68" r="3" fill="#FBBF24"/>
    <circle cx="350" cy="68" r="3" fill="#34D399"/>
    <rect class="line" x="330" y="88" width="70" height="6" rx="3" fill="#F472B6"/>
    <rect class="line l2" x="342" y="101" width="100" height="6" rx="3" fill="#67E8F9"/>
    <rect class="line l3" x="342" y="114" width="60" height="6" rx="3" fill="#FDE047"/>
    <rect class="line l4" x="330" y="127" width="90" height="6" rx="3" fill="#86EFAC"/>
    <rect class="line l5" x="330" y="140" width="50" height="6" rx="3" fill="#C4B5FD"/>
    <rect class="cursor" x="330" y="153" width="7" height="10" fill="#fff"/>
  </g>

  <!-- plant -->
  <g class="sway">
    <ellipse cx="124" cy="238" rx="6" ry="17" fill="#22C55E"/>
    <ellipse cx="113" cy="245" rx="5" ry="14" fill="#16A34A" transform="rotate(-30 113 245)"/>
    <ellipse cx="135" cy="245" rx="5" ry="14" fill="#16A34A" transform="rotate(30 135 245)"/>
  </g>
  <path d="M110 278 L114 257 L134 257 L138 278 Z" fill="#C2410C"/>

  <!-- person: back hair -->
  <ellipse cx="240" cy="160" rx="35" ry="43" fill="#2B1B17"/>
  <!-- neck -->
  <rect x="231" y="168" width="18" height="20" fill="#F2C29B"/>
  <!-- hoodie -->
  <path d="M186 228 Q186 189 215 183 L265 183 Q294 189 294 228 Z" fill="#7C6FF0"/>
  <path d="M232 186 L232 206 M248 186 L248 206" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>
  <!-- head -->
  <circle cx="240" cy="148" r="28" fill="#F2C29B"/>
  <circle cx="222" cy="160" r="4" fill="#F9A8D4" opacity=".45"/>
  <circle cx="258" cy="160" r="4" fill="#F9A8D4" opacity=".45"/>
  <!-- glasses -->
  <circle cx="229" cy="150" r="9" fill="#fff" fill-opacity=".18" stroke="#1F2937" stroke-width="2"/>
  <circle cx="251" cy="150" r="9" fill="#fff" fill-opacity=".18" stroke="#1F2937" stroke-width="2"/>
  <path d="M238 150 L242 150" stroke="#1F2937" stroke-width="2"/>
  <circle class="eye" cx="229" cy="150" r="2.6" fill="#1F2937"/>
  <circle class="eye" cx="251" cy="150" r="2.6" fill="#1F2937"/>
  <path d="M233 162 Q240 169 247 162" stroke="#9A3412" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- fringe -->
  <path d="M210 147 Q213 116 240 116 Q267 116 270 147 Q256 128 240 130 Q224 128 210 147 Z" fill="#2B1B17"/>
  <!-- arms -->
  <path class="tapL" d="M201 203 Q196 217 212 228" stroke="#6A5DE0" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path class="tapR" d="M279 203 Q284 217 268 228" stroke="#6A5DE0" stroke-width="14" stroke-linecap="round" fill="none"/>

  <!-- laptop (back of lid) -->
  <rect x="178" y="220" width="124" height="56" rx="6" fill="#D6DAE4" stroke="#AEB4C4" stroke-width="1.5"/>
  <text class="glow" x="240" y="255" text-anchor="middle" font-family="'Courier New',monospace" font-size="20" font-weight="bold" fill="#7C6FF0">&lt;/&gt;</text>
  <rect x="168" y="274" width="144" height="5" rx="2.5" fill="#AEB4C4"/>

  <!-- desk -->
  <rect x="90" y="279" width="300" height="10" rx="4" fill="#8B5E3C"/>
  <rect x="110" y="289" width="8" height="40" fill="#6B452B"/>
  <rect x="362" y="289" width="8" height="40" fill="#6B452B"/>

  <!-- coffee mug -->
  <rect x="338" y="256" width="22" height="23" rx="4" fill="#fff" stroke="#94A3B8" stroke-width="1.5"/>
  <path d="M360 261 Q373 263 360 273" stroke="#94A3B8" stroke-width="2" fill="none"/>
  <path class="steam" d="M344 250 Q340 244 344 238" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path class="steam s2" d="M350 250 Q346 244 350 238" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path class="steam s3" d="M356 250 Q352 244 356 238" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
